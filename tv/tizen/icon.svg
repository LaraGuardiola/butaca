<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0a12"/>
      <stop offset="1" stop-color="#12030a"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#ff6b6b" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#b3122a" stop-opacity="0.18"/>
